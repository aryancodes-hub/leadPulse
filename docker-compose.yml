version: '3.8'

services:
  core-api:
    build:
      context: .
      dockerfile: Dockerfile.core-api
    ports:
      - "5000:5000"

  email-service:
    build:
      context: .
      dockerfile: Dockerfile.email-service
    ports:
      - "4000:4000"

  import-service:
    build:
      context: .
      dockerfile: Dockerfile.import-service
    ports:
      - "3002:3002"